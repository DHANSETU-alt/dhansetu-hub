name = "dhansetuhub"
main = ".wrangler/state/bundle_wrangler_service_worker.js"
compatibility_date = "2024-12-16"

[env.production]
routes = [
  { pattern = "dhansetuhub.in/*", zone_name = "dhansetuhub.in" }
]

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "dhansetuhub-assets"

[build]
command = "npm run build"
cwd = "."
watch_paths = ["app/**/*.tsx", "app/**/*.ts", "public/**/*"]

[[build.upload_rules]]
type = "CompiledContentType"
globs = ["**/*.wasm"]
