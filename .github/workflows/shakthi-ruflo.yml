name: Shakthi Ruflo launch gate
on:
  push:
    branches: [codex-launch-20261019]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - name: Browser/public verification equivalent
        run: node scripts/ruflo-final-verify.js
      - name: Verify public launch
        run: VERIFY_SECONDS=30 VERIFY_INTERVAL=10 bash scripts/verify-live.sh
